name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build step (which touches env-dependent
          # code paths at module load time) doesn't fail here — the real
          # values live only in the server's .env and are never used by
          # this CI build, which exists purely as a validation gate before
          # the deploy step below.
          NEXT_PUBLIC_WORDPRESS_URL: https://adaptsmedia.info/cmsmedia
          WORDPRESS_URL: https://adaptsmedia.info/cmsmedia
          DATABASE_URL: postgresql://user:password@host/dbname
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD: ci
          SESSION_SECRET: ci-build-only-not-a-real-secret

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key installed on the server is restricted (forced command
          # in authorized_keys) to only ever run deploy.sh, regardless of
          # what's sent here — this is just for clarity/logging.
          script: bash /opt/adaptsmedia/deploy.sh
